<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HipDAO 지도</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;touch-action:none}

@keyframes pulseOp{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideUp{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulseOp 2s ease-in-out infinite}
.slideup{animation:slideUp .38s cubic-bezier(.34,1.56,.64,1)}

/* 지도 컨테이너 */
#mapWrap{position:fixed;inset:0;z-index:0}
#map{width:100%;height:100%}

/* 반경 원 캔버스 오버레이 */
#overlayCanvas{position:fixed;inset:0;pointer-events:none;z-index:2}

/* ── 슬라이더 */
#top{position:fixed;top:0;left:0;right:0;z-index:20;
  background:rgba(0,0,0,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);padding:11px 16px 13px}
.row{display:flex;align-items:center;gap:8px}
#top label{color:rgba(255,255,255,.4);font-size:10px;font-weight:700;letter-spacing:2px;white-space:nowrap}
input[type=range]{flex:1;-webkit-appearance:none;height:5px;border-radius:9999px;background:#27272a;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;border:4px solid #fbbf24;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.val{color:#fbbf24;font-weight:900;font-size:13px;min-width:56px;text-align:right}

/* 지도 타입 토글 */
#mapTypeWrap{display:flex;gap:3px;flex-shrink:0}
.mtBtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:8px;color:rgba(255,255,255,.55);font-size:10px;font-weight:700;
  padding:5px 8px;cursor:pointer;white-space:nowrap;transition:all .2s}
.mtBtn.active{background:#fbbf24;border-color:#fbbf24;color:#000}

/* ── 반경 칩 */
#chip{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none}
.chipInner{background:rgba(0,0,0,.84);backdrop-filter:blur(14px);border:1px solid rgba(251,191,36,.5);
  padding:6px 16px;border-radius:9999px;display:flex;align-items:center;gap:6px;
  box-shadow:0 0 16px rgba(251,191,36,.18);white-space:nowrap}
.chipInner span{color:#fbbf24;font-weight:900;font-size:12px}

/* ── 골든 핀 필터 */
#filterBtn{position:fixed;top:104px;right:14px;z-index:20;
  background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);color:rgba(255,255,255,.45);
  padding:7px 13px;border-radius:9999px;font-size:10px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s}
#filterBtn.on{background:#fbbf24;border-color:#fbbf24;color:#000}

/* ── 우측 버튼 */
#rightBtns{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.rbtn{width:38px;height:38px;background:rgba(0,0,0,.84);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);color:#fff;border-radius:10px;font-size:18px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1}
.rbtn:hover{background:rgba(251,191,36,.18)}
.rbtn:active{transform:scale(.9)}
#locBtn{font-size:16px;border-color:rgba(251,191,36,.35);color:#fbbf24;margin-top:6px}

/* ── 가맹점 카드 */
#card{position:fixed;bottom:20px;left:18px;right:18px;z-index:20;display:none}
.cbox{background:rgba(3,3,6,.96);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.09);
  padding:16px;border-radius:22px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.7);position:relative}
.cico{width:48px;height:48px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.cname{color:#fff;font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{display:flex;gap:5px;margin-top:3px;align-items:center;flex-wrap:wrap}
.gbadge{background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.3);color:#fbbf24;font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px}
.rwd{color:#fbbf24;font-weight:700;font-size:11px}
.navbtn{background:#fbbf24;color:#000;padding:8px 12px;border-radius:10px;font-weight:900;font-size:11px;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.closex{position:absolute;top:-8px;right:-8px;width:22px;height:22px;background:rgba(255,255,255,.15);
  border-radius:50%;border:none;color:rgba(255,255,255,.45);font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}

/* ── 공통 바텀 시트 */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sheetPanel{position:absolute;bottom:0;left:0;right:0;background:#111;border-radius:24px 24px 0 0;
  padding:24px 20px 40px;border-top:1px solid rgba(255,255,255,.1);max-height:88vh;overflow-y:auto}
.sheetTitle{color:#fff;font-size:15px;font-weight:900;margin-bottom:4px;text-align:center}
.sheetSub{color:rgba(255,255,255,.4);font-size:11px;text-align:center;margin-bottom:18px}
.cancelBtn{width:100%;margin-top:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:13px;color:rgba(255,255,255,.5);font-weight:700;font-size:13px;cursor:pointer}

/* ── 길찾기 앱 */
.navApps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.appBtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;
  padding:14px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s;width:100%}
.appBtn:hover{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
.appBtn:active{transform:scale(.97)}
.appIcon{font-size:24px;flex-shrink:0}
.appName{color:#fff;font-weight:700;font-size:13px;text-align:left}
.appDesc{color:rgba(255,255,255,.4);font-size:10px;margin-top:1px;text-align:left}

/* ── 내위치 시트 */
.locSection{margin-bottom:14px}
.locLabel{color:rgba(255,255,255,.5);font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px;display:block}
.searchRow{display:flex;gap:8px}
.locInput{flex:1;background:#1c1c1e;border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:10px 12px;color:#fff;font-size:14px;outline:none}
.locInput:focus{border-color:rgba(251,191,36,.5)}
.searchBtn{background:#fbbf24;border:none;border-radius:10px;padding:10px 14px;
  color:#000;font-weight:900;font-size:12px;cursor:pointer;white-space:nowrap}
.coordRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.coordBox{display:flex;flex-direction:column;gap:4px}
.coordBox label{color:rgba(255,255,255,.4);font-size:10px;font-weight:700}
.coordInput{background:#1c1c1e;border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:9px 10px;color:#fbbf24;font-size:13px;font-weight:700;outline:none;width:100%}
.coordInput:focus{border-color:rgba(251,191,36,.5)}
.confirmBtn{width:100%;background:#fbbf24;border:none;border-radius:12px;padding:14px;
  color:#000;font-weight:900;font-size:14px;cursor:pointer;margin-top:4px}
.gpsBtn{width:100%;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:12px;
  padding:12px;color:#fbbf24;font-weight:900;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.divider span{color:rgba(255,255,255,.3);font-size:11px;font-weight:600}

/* ── 토스트 */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);
  border-radius:9999px;padding:9px 18px;font-size:12px;font-weight:700;color:#fff;
  white-space:nowrap;display:none;animation:fadeIn .25s ease}

/* ── 범례 */
#legend{position:fixed;bottom:20px;left:14px;z-index:20;background:rgba(0,0,0,.76);
  backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:11px;
  padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.lrow{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.5);font-weight:600}
.ldot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── 로딩 */
#loader{position:fixed;inset:0;background:#0b0e14;z-index:80;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:30px;height:30px;border:3px solid rgba(251,191,36,.2);border-top-color:#fbbf24;
  border-radius:50%;animation:spin .7s linear infinite}
.ltxt{color:#fbbf24;font-weight:900;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><div class="ltxt">카카오맵 로딩 중...</div></div>

<!-- 슬라이더 + 지도 타입 토글 -->
<div id="top">
  <div class="row">
    <label>탐색 반경</label>
    <input type="range" id="slider" min="0" max="100" value="18"/>
    <span class="val" id="distVal">2.2km</span>
    <div id="mapTypeWrap">
      <button class="mtBtn active" id="btnRoad">🗺 일반</button>
      <button class="mtBtn" id="btnSky">🛰 위성</button>
    </div>
  </div>
</div>

<!-- 반경 칩 -->
<div id="chip">
  <div class="chipInner pulse">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <span id="chipLbl">2.2km 탐색 중</span>
  </div>
</div>

<!-- 골든 핀 필터 -->
<button id="filterBtn">
  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
  </svg>골든 핀만
</button>

<!-- 줌 + 내위치 -->
<div id="rightBtns">
  <button class="rbtn" id="zinBtn">+</button>
  <button class="rbtn" id="zoutBtn">−</button>
  <button class="rbtn" id="locBtn">📍</button>
</div>

<!-- 지도 -->
<div id="mapWrap"><div id="map"></div></div>

<!-- 반경 캔버스 오버레이 -->
<canvas id="overlayCanvas"></canvas>

<!-- 가맹점 카드 -->
<div id="card">
  <div class="cbox slideup">
    <div class="cico" id="cico"></div>
    <div style="flex:1;min-width:0">
      <div class="cname" id="cname"></div>
      <div class="cmeta">
        <span class="gbadge" id="cbadge" style="display:none">⭐ 골든 핀</span>
        <span class="rwd">⚡ sat 4% 보상</span>
      </div>
    </div>
    <button class="navbtn" id="navbtn">🗺 길찾기</button>
    <button class="closex" id="closex">✕</button>
  </div>
</div>

<!-- 길찾기 앱 선택 시트 -->
<div class="sheet" id="navSheet">
  <div class="sheetBg" id="navBg"></div>
  <div class="sheetPanel slideup">
    <div class="sheetTitle" id="navTitle">길찾기</div>
    <div class="sheetSub">앱을 선택하세요</div>
    <div class="navApps">
      <button class="appBtn" id="appKakao"><span class="appIcon">🟡</span><div><div class="appName">카카오맵</div><div class="appDesc">카카오내비</div></div></button>
      <button class="appBtn" id="appNaver"><span class="appIcon">🟢</span><div><div class="appName">네이버지도</div><div class="appDesc">네이버내비</div></div></button>
      <button class="appBtn" id="appTmap"><span class="appIcon">🔴</span><div><div class="appName">T맵</div><div class="appDesc">SK 내비</div></div></button>
      <button class="appBtn" id="appGoogle"><span class="appIcon">🔵</span><div><div class="appName">구글맵</div><div class="appDesc">Google Maps</div></div></button>
    </div>
    <button class="cancelBtn" id="navCancel">취소</button>
  </div>
</div>

<!-- 내위치 설정 시트 -->
<div class="sheet" id="locSheet">
  <div class="sheetBg" id="locBg"></div>
  <div class="sheetPanel slideup">
    <div class="sheetTitle">📍 내 위치 설정</div>
    <div class="sheetSub">GPS 또는 주소/좌표로 입력하세요</div>
    <button class="gpsBtn" id="gpsBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
      </svg>GPS로 현재 위치 가져오기
    </button>
    <div class="divider"><span>또는 주소 검색</span></div>
    <div class="locSection">
      <span class="locLabel">주소 검색 (카카오 주소 API)</span>
      <div class="searchRow">
        <input class="locInput" id="locSearchInput" type="text" placeholder="예) 평택 고덕동, 안중읍..."/>
        <button class="searchBtn" id="locSearchBtn">검색</button>
      </div>
      <div id="searchResults" style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="divider"><span>또는 좌표 직접 입력</span></div>
    <div class="locSection">
      <span class="locLabel">위경도 좌표</span>
      <div class="coordRow">
        <div class="coordBox"><label>위도 (Lat)</label><input class="coordInput" id="locLat" type="number" step="0.0001" value="37.0601"/></div>
        <div class="coordBox"><label>경도 (Lng)</label><input class="coordInput" id="locLng" type="number" step="0.0001" value="127.0921"/></div>
      </div>
    </div>
    <button class="confirmBtn" id="locConfirm">✅ 이 위치로 설정</button>
    <button class="cancelBtn" id="locCancel">취소</button>
  </div>
</div>

<div id="toast"></div>

<!-- 범례 -->
<div id="legend">
  <div class="lrow"><div class="ldot" style="background:#fbbf24;box-shadow:0 0 5px #fbbf24"></div>내 위치</div>
  <div class="lrow"><div class="ldot" style="background:#fbbf24;border:2px solid #fff"></div>골든 핀</div>
  <div class="lrow"><div class="ldot" style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)"></div>일반 가맹점</div>
</div>

<!-- 카카오맵 SDK -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0c7c9a0989d717b9834d75359e729f82&libraries=services"></script>
<script>
// ═══════════════════════════════
//  데이터
// ═══════════════════════════════
var MY_LAT=37.0601, MY_LNG=127.0921;
var userLat=MY_LAT, userLng=MY_LNG;
var MERCHANTS=[
  {id:1,name:'화덕피자 델리치오소',lat:37.0620,lng:127.0950,isGolden:true},
  {id:2,name:'카페 아우라',        lat:37.0580,lng:127.0870,isGolden:false},
  {id:3,name:'그린 샐러드 하우스', lat:37.0660,lng:127.0810,isGolden:true},
  {id:4,name:'스시 마스터',        lat:37.0540,lng:127.1010,isGolden:false},
  {id:5,name:'더 버거 조인트',     lat:37.0700,lng:127.0780,isGolden:true},
];

var percent=18, filterGolden=false, selectedId=null, currentNavTarget=null;
var map, markers=[], myMarker=null, radiusCircle=null;
var bounceT=0;

// ═══════════════════════════════
//  거리
// ═══════════════════════════════
function pctToKm(p){if(p<=33.3)return(p/33.3)*4;if(p<=66.6)return 4+((p-33.3)/33.3)*396;return 400+((p-66.6)/33.4)*39600;}
function fmtDist(p){var d=pctToKm(p);if(d<1)return Math.round(d*1000)+'m';if(d>=40000)return '글로벌';if(d>=1000)return(d/1000).toFixed(1)+'k km';return d.toFixed(1)+'km';}
function setLabel(p){var l=fmtDist(p);document.getElementById('distVal').textContent=l;document.getElementById('chipLbl').textContent=l+' 탐색 중';}

// ═══════════════════════════════
//  카카오맵 초기화
// ═══════════════════════════════
kakao.maps.load(function(){
  document.getElementById('loader').style.display='none';

  var container=document.getElementById('map');
  var options={
    center: new kakao.maps.LatLng(MY_LAT, MY_LNG),
    level: 5,
  };
  map=new kakao.maps.Map(container, options);

  // 지도 타입 컨트롤 (카카오 기본)
  var mapTypeControl=new kakao.maps.MapTypeControl();
  map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

  // 내 위치 마커 (황금 커스텀)
  var myIconSvg='<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">'
    +'<circle cx="14" cy="14" r="12" fill="#fbbf24" stroke="white" stroke-width="3"/>'
    +'<circle cx="14" cy="14" r="5" fill="white"/>'
    +'</svg>';
  var myIcon=new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(myIconSvg),
    new kakao.maps.Size(28,28),
    {offset: new kakao.maps.Point(14,14)}
  );
  myMarker=new kakao.maps.Marker({
    position: new kakao.maps.LatLng(userLat,userLng),
    map: map,
    image: myIcon,
    zIndex: 10,
  });

  // 반경 원
  updateRadiusCircle();

  // 가맹점 마커
  renderMarkers();

  // 지도 클릭 → 카드 닫기
  kakao.maps.event.addListener(map,'click',function(){
    selectedId=null;
    document.getElementById('card').style.display='none';
  });
});

// ═══════════════════════════════
//  반경 원 업데이트
// ═══════════════════════════════
function updateRadiusCircle(){
  if(!map) return;
  var km=pctToKm(percent);
  if(radiusCircle) radiusCircle.setMap(null);
  radiusCircle=new kakao.maps.Circle({
    center: new kakao.maps.LatLng(userLat,userLng),
    radius: km*1000,
    strokeWeight: 2.5,
    strokeColor: '#fbbf24',
    strokeOpacity: 0.9,
    strokeStyle: 'solid',
    fillColor: '#fbbf24',
    fillOpacity: 0.06,
  });
  radiusCircle.setMap(map);
}

// ═══════════════════════════════
//  가맹점 마커
// ═══════════════════════════════
function renderMarkers(){
  if(!map) return;
  markers.forEach(function(m){m.setMap(null);});
  markers=[];

  var list=filterGolden?MERCHANTS.filter(function(m){return m.isGolden;}):MERCHANTS;
  list.forEach(function(m){
    var svg=m.isGolden
      ? '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">'
        +'<circle cx="20" cy="20" r="18" fill="#fbbf24" stroke="white" stroke-width="2.5"/>'
        +'<text x="20" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="black">★</text>'
        +'</svg>'
      : '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">'
        +'<circle cx="17" cy="17" r="15" fill="rgba(40,40,50,0.9)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>'
        +'<text x="17" y="23" text-anchor="middle" font-size="15">🛍</text>'
        +'</svg>';
    var size=m.isGolden?40:34;
    var icon=new kakao.maps.MarkerImage(
      'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),
      new kakao.maps.Size(size,size),
      {offset:new kakao.maps.Point(size/2,size/2)}
    );
    var marker=new kakao.maps.Marker({
      position: new kakao.maps.LatLng(m.lat,m.lng),
      map: map,
      image: icon,
      title: m.name,
    });
    (function(merchant,mk){
      kakao.maps.event.addListener(mk,'click',function(){
        selectedId=merchant.id;
        openCard(merchant);
      });
    })(m,marker);
    markers.push(marker);
  });
}

// ═══════════════════════════════
//  지도 타입 토글 (일반/위성)
// ═══════════════════════════════
document.getElementById('btnRoad').addEventListener('click',function(){
  if(!map) return;
  map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
  document.getElementById('btnRoad').classList.add('active');
  document.getElementById('btnSky').classList.remove('active');
});
document.getElementById('btnSky').addEventListener('click',function(){
  if(!map) return;
  map.setMapTypeId(kakao.maps.MapTypeId.HYBRID); // 위성+도로명 레이어
  document.getElementById('btnSky').classList.add('active');
  document.getElementById('btnRoad').classList.remove('active');
});

// ═══════════════════════════════
//  줌 버튼
// ═══════════════════════════════
document.getElementById('zinBtn').addEventListener('click',function(){if(map)map.setLevel(map.getLevel()-1);});
document.getElementById('zoutBtn').addEventListener('click',function(){if(map)map.setLevel(map.getLevel()+1);});

// ═══════════════════════════════
//  슬라이더
// ═══════════════════════════════
document.getElementById('slider').addEventListener('input',function(){
  percent=parseInt(this.value);
  setLabel(percent);
  updateRadiusCircle();
});

// ═══════════════════════════════
//  골든 핀 필터
// ═══════════════════════════════
document.getElementById('filterBtn').addEventListener('click',function(){
  filterGolden=!filterGolden;
  this.classList.toggle('on',filterGolden);
  selectedId=null;
  document.getElementById('card').style.display='none';
  renderMarkers();
});

// ═══════════════════════════════
//  📍 내 위치 버튼
// ═══════════════════════════════
document.getElementById('locBtn').addEventListener('click',function(){
  if(navigator.geolocation){
    showToast('📡 GPS 위치 찾는 중...');
    navigator.geolocation.getCurrentPosition(
      function(pos){
        userLat=pos.coords.latitude; userLng=pos.coords.longitude;
        moveToUser();
        showToast('📍 현재 위치로 이동했습니다');
      },
      function(){ openLocSheet(); },
      {timeout:5000}
    );
  } else { openLocSheet(); }
});

function moveToUser(){
  if(!map) return;
  var pos=new kakao.maps.LatLng(userLat,userLng);
  map.setCenter(pos);
  if(myMarker) myMarker.setPosition(pos);
  updateRadiusCircle();
}

function openLocSheet(){
  document.getElementById('locLat').value=userLat.toFixed(6);
  document.getElementById('locLng').value=userLng.toFixed(6);
  var sheet=document.getElementById('locSheet');
  sheet.style.display='block';
  var panel=sheet.querySelector('.sheetPanel');
  panel.classList.remove('slideup'); void panel.offsetWidth; panel.classList.add('slideup');
}

// GPS 버튼 (시트 안)
document.getElementById('gpsBtn').addEventListener('click',function(){
  if(!navigator.geolocation){showToast('❌ GPS 사용 불가');return;}
  showToast('📡 GPS 위치 찾는 중...');
  navigator.geolocation.getCurrentPosition(
    function(pos){
      document.getElementById('locLat').value=pos.coords.latitude.toFixed(6);
      document.getElementById('locLng').value=pos.coords.longitude.toFixed(6);
      showToast('✅ GPS 완료 — 설정 버튼을 눌러주세요');
    },
    function(){showToast('❌ GPS 실패 — 주소 검색 또는 직접 입력해 주세요');}
  );
});

// 카카오 주소 검색 (REST API)
document.getElementById('locSearchBtn').addEventListener('click',function(){
  var q=document.getElementById('locSearchInput').value.trim();
  if(!q){showToast('주소를 입력해주세요');return;}
  showToast('🔍 검색 중...');
  fetch('https://dapi.kakao.com/v2/local/search/keyword.json?query='+encodeURIComponent(q)+'&size=5',{
    headers:{'Authorization':'KakaoAK 0c7c9a0989d717b9834d75359e729f82'}
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var results=document.getElementById('searchResults');
    results.innerHTML='';
    if(!data.documents||!data.documents.length){showToast('❌ 검색 결과 없음');return;}
    data.documents.forEach(function(d){
      var btn=document.createElement('button');
      btn.style.cssText='background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:#fff;font-size:12px;text-align:left;cursor:pointer;width:100%';
      btn.innerHTML='<div style="font-weight:700;margin-bottom:2px">'+d.place_name+'</div><div style="color:rgba(255,255,255,.4);font-size:10px">'+d.road_address_name+'</div>';
      btn.addEventListener('click',function(){
        document.getElementById('locLat').value=parseFloat(d.y).toFixed(6);
        document.getElementById('locLng').value=parseFloat(d.x).toFixed(6);
        results.innerHTML='';
        showToast('✅ '+d.place_name+' — 설정 버튼을 눌러주세요');
      });
      results.appendChild(btn);
    });
  })
  .catch(function(){showToast('❌ 검색 실패');});
});
document.getElementById('locSearchInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('locSearchBtn').click();});

// 확인
document.getElementById('locConfirm').addEventListener('click',function(){
  var lat=parseFloat(document.getElementById('locLat').value);
  var lng=parseFloat(document.getElementById('locLng').value);
  if(isNaN(lat)||isNaN(lng)){showToast('❌ 올바른 좌표를 입력하세요');return;}
  userLat=lat; userLng=lng;
  moveToUser();
  document.getElementById('locSheet').style.display='none';
  showToast('📍 위치가 변경되었습니다');
});
document.getElementById('locCancel').addEventListener('click',function(){document.getElementById('locSheet').style.display='none';});
document.getElementById('locBg').addEventListener('click',function(){document.getElementById('locSheet').style.display='none';});

// ═══════════════════════════════
//  가맹점 카드
// ═══════════════════════════════
function openCard(m){
  document.getElementById('cico').textContent=m.isGolden?'⭐':'🛍';
  document.getElementById('cico').style.background=m.isGolden?'#fbbf24':'rgba(255,255,255,.1)';
  document.getElementById('cname').textContent=m.name;
  document.getElementById('cbadge').style.display=m.isGolden?'inline-block':'none';
  currentNavTarget=m;
  var wrap=document.getElementById('card');
  wrap.style.display='block';
  var box=wrap.querySelector('.cbox');
  box.classList.remove('slideup'); void box.offsetWidth; box.classList.add('slideup');
}
document.getElementById('closex').addEventListener('click',function(){document.getElementById('card').style.display='none';selectedId=null;});

// ═══════════════════════════════
//  길찾기 앱 선택
// ═══════════════════════════════
document.getElementById('navbtn').addEventListener('click',function(){
  if(!currentNavTarget)return;
  document.getElementById('navTitle').textContent='🗺 '+currentNavTarget.name;
  var sheet=document.getElementById('navSheet');
  sheet.style.display='block';
  var panel=sheet.querySelector('.sheetPanel');
  panel.classList.remove('slideup'); void panel.offsetWidth; panel.classList.add('slideup');
});

function navTo(app){
  var m=currentNavTarget; if(!m)return;
  var lat=m.lat,lng=m.lng,name=encodeURIComponent(m.name);
  var web={
    kakao:'https://map.kakao.com/link/to/'+name+','+lat+','+lng,
    naver:'https://map.naver.com/index.nhn?elng='+lng+'&elat='+lat+'&etext='+name+'&menu=route&pathType=1',
    tmap:'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng,
    google:'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=driving',
  };
  var app_url={
    kakao:'kakaomap://route?ep='+lat+','+lng+'&by=CAR',
    naver:'nmap://route/car?dlat='+lat+'&dlng='+lng+'&dname='+name+'&appname=hipdao',
    tmap:'tmap://route?goalname='+name+'&goalx='+lng+'&goaly='+lat,
    google:'comgooglemaps://maps?daddr='+lat+','+lng+'&directionsmode=driving',
  };
  window.location.href=app_url[app];
  setTimeout(function(){window.open(web[app],'_blank');},1500);
  closeNavSheet();
}
document.getElementById('appKakao').addEventListener('click',function(){navTo('kakao');});
document.getElementById('appNaver').addEventListener('click',function(){navTo('naver');});
document.getElementById('appTmap').addEventListener('click',function(){navTo('tmap');});
document.getElementById('appGoogle').addEventListener('click',function(){navTo('google');});
document.getElementById('navCancel').addEventListener('click',closeNavSheet);
document.getElementById('navBg').addEventListener('click',closeNavSheet);
function closeNavSheet(){document.getElementById('navSheet').style.display='none';}

// ═══════════════════════════════
//  토스트
// ═══════════════════════════════
var toastTimer=null;
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.display='none';},3000);
}

setLabel(percent);
</script>
</body>
</html>
